<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b1324"><title>YU7 Pro 提车验车</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar"><div><p class="eyebrow">DELIVERY CHECK / 2026</p><h1>YU7 Pro 提车验车</h1></div><span class="saved">● 已保存</span></header>
    <nav class="tabs" aria-label="主导航"><button class="tab active" data-tab="inspection">检查清单</button><button class="tab" data-tab="report">验车报告</button></nav>
    <section id="inspection-page" class="page">
      <div class="hero"><div class="hero-mark">YU7</div><div class="hero-copy"><strong>把每一个细节，留在交付之前。</strong><span id="hero-meta"></span></div><div class="progress-ring"><span id="progress-percent">0%</span></div></div>
      <div class="progress-track"><i id="progress-bar"></i></div>
      <div class="stats" id="stats"></div>
      <div class="notice">ⓘ 建议先检查第一、二章。异常项目拍照留证，问题闭环前不付款、不签字。</div>
      <div id="chapters"></div><button id="add-chapter" class="ghost wide">＋ 新增验车章节</button>
    </section>
    <section id="report-page" class="page hidden"><div class="report-head"><div><p class="eyebrow">DOCUMENT / LOCAL</p><h2>验车报告</h2></div><button id="copy-report" class="ghost">复制文本</button></div><pre id="report" class="report-box"></pre></section>
  </main>
  <footer class="bottom-bar"><button id="reset" class="reset">↺ 重置</button><button id="generate" class="primary">生成验车报告</button></footer>
  <dialog id="edit-dialog"><form method="dialog" id="edit-form"><h3 id="edit-title">编辑</h3><label>名称<input id="edit-name" required></label><label>说明<textarea id="edit-desc" rows="4"></textarea></label><label id="veto-row" class="check"><input id="edit-veto" type="checkbox"> 一票否决项</label><div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button value="save" class="primary">保存修改</button></div></form></dialog>
  <dialog id="ai-dialog"><form id="ai-form"><h3>AI 验车报告</h3><label>API Key<input id="ai-key" type="password" placeholder="仅本次使用"></label><label>Endpoint<input id="ai-endpoint" value="https://apinebula.ai/v1/responses"></label><label>模型<input id="ai-model" value="gpt-5.6-sol"></label><p id="ai-error"></p><div class="dialog-actions"><button type="button" id="ai-cancel" class="ghost">取消</button><button type="submit" class="primary">使用 AI 生成</button></div></form></dialog>
  <dialog id="date-dialog"><form method="dialog" id="date-form"><h3 id="date-title">日期码录入</h3><div id="date-fields"></div><div class="dialog-actions"><button value="cancel" class="ghost">取消</button><button value="save" class="primary">保存日期</button></div></form></dialog>
  <input id="camera-input" type="file" accept="image/*" capture="environment" hidden><input id="gallery-input" type="file" accept="image/*" multiple hidden>
  <script src="app.js"></script>
</body>
</html>
